<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="RIBOTE--MORAL Noa">
    <meta name="description" content="Linux CHMOD command permission calculator and converter.">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/linux_yellow_logo.ico">
    <title>CHMOD Calculator | RIBOTE--MORAL Noa</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://unpkg.com/@coreui/icons/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main id="particles-js" class="FlexCenter">
        <nav>
            <button class="appTask"><i class="fa-solid fa-shield-halved"></i></button>
            <button id="terminalTask"><i class="cil-terminal"></i></button>
            <button id="wikiTask"><i class="fa-solid fa-globe"></i></button>
        </nav>

        <button id="IconDesktop" class="appTask FlexCenter">
            <i class="fa-solid fa-shield-halved"></i>
            <strong>CHMOD Calculator</strong>
        </button>

        <main id="interface" class="container FlexCenter">
            <button id="closeInterface"><i class="fa-solid fa-xmark"></i></button>
            <h1>CHMOD Calculator</h1>
            <p class="subtitle">Convert Linux permissions between numeric and symbolic notation.</p>
            <section class="calculator">

                <div class="top">
                    <div class="input-group">
                        <label for="octal">Numeric</label>
                        <input id="octal" type="text" value="755" maxlength="4" placeholder="755" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="symbolic">Symbolic</label>
                        <input id="symbolic" type="text" value="rwxr-xr-x" placeholder="rwxr-xr-x" autocomplete="off">
                    </div>
                </div>

                <div class="permissions">
                    <div class="permission-group">
                        <h3>Owner</h3>
                        <label class="permission">Read (r)
                            <input type="checkbox" id="owner-r"><span class="toggle"></span>
                        </label>
                        <label class="permission">Write (w)
                            <input type="checkbox" id="owner-w"><span class="toggle"></span>
                        </label>
                        <label class="permission">Execute (x)
                            <input type="checkbox" id="owner-x"><span class="toggle"></span>
                        </label>
                    </div>
                    <div class="permission-group">
                        <h3>Group</h3>
                        <label class="permission">Read (r)
                            <input type="checkbox" id="group-r"><span class="toggle"></span>
                        </label>
                        <label class="permission">Write (w)
                            <input type="checkbox" id="group-w"><span class="toggle"></span>
                        </label>
                        <label class="permission">Execute (x)
                            <input type="checkbox" id="group-x"><span class="toggle"></span>
                        </label>
                    </div>
                    <div class="permission-group">
                        <h3>Others</h3>
                        <label class="permission">Read (r)
                            <input type="checkbox" id="other-r"><span class="toggle"></span>
                        </label>
                        <label class="permission">Write (w)
                            <input type="checkbox" id="other-w"><span class="toggle"></span>
                        </label>
                        <label class="permission">Execute (x)
                            <input type="checkbox" id="other-x"><span class="toggle"></span>
                        </label>
                    </div>
                </div>

                <div class="result">
                    <div class="result-box">
                        <div class="label">Numeric</div>
                        <div class="value" id="octalResult">755</div>
                    </div>
                    <div class="result-box">
                        <div class="label">Symbolic</div>
                        <div class="value" id="symbolicResult">rwxr-xr-x</div>
                    </div>
                </div>
                <div class="containerCopyCMD">
                    <div class="command" id="command" title="Cliquer pour copier">chmod 755 [cible]</div>
                    <i id="copyIconFile" class="fa-solid fa-copy"></i>
                </div>
            </section>
        </main>
        
        <div class="terminal" id="terminal">
            <div class="terminal-header" id="terminalHeader">
                <div class="terminal-title">
                    <span class="terminal-icon">▸_</span>
                    <span>Terminal</span>
                </div>
                <div class="window-buttons">
                    <button class="window-btn" id="minimizeBtn" title="Réduire"><i class="fa-solid fa-minus"></i></button>
                    <button class="window-btn" id="maximizeBtn" title="Plein écran"><i class="fa-regular fa-square"></i></button>
                    <button class="window-btn close" id="closeBtn" title="Fermer"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="terminal-body" id="terminalBody">
                <div class="line firstcolor">Terminal exemple</div>
                <div class="line gray">Type "help" to display the available commands.</div>
                <br>
                <div class="command-line">
                    <span class="prompt">alous@noaribote.fr<span class="white">:</span><span class="blue">~</span><span class="white">$</span></span>
                    <input class="command-input" id="commandInput" autocomplete="off" spellcheck="false">
                </div>
            </div>
        </div>
    </main>
</body>
<script src="lib/particles-vincent-garreau/particles.js"></script>
<script src="lib/particles-vincent-garreau/app.js"></script>
<script src="assets/scripts/nav_buttons.js"></script>
<script src="assets/scripts/terminal.js"></script>
<script src="assets/scripts/calculator.js" type="module"></script>
</html>
